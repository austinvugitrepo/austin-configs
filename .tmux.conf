bind -r C-j resizep -D
bind -r C-k resizep -U
bind -r C-h resizep -L
bind -r C-l resizep -R
bind j selectp -D
bind k selectp -U
bind h selectp -L
bind l selectp -R
 
#rebinding default l keybinding to Right:
bind Right last 

set -g mode-keys vi
set -g status-keys vi

set -g status-style fg=blue 
set -ag status-style bg=white
set -g status-position top
set -g clock-mode-colour yellow
set -g pane-border-style bg=white
set -g pane-active-border-style bg=yellow
set -g copy-mode-selection-style bg=white
set -g window-style fg=white
set -ag window-style bg=blue 
